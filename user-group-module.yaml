---
- name: Testing new user creation
  hosts: fedora
  become: true
  vars_files:
    - vault.yaml
  tasks:
    - name: creating an user with arguments
      ansible.builtin.user:
        name: john
        comment: John Doe
        uid: 1040
        state: present
        groups: 
          - ragu
          - wheel
        create_home: true
        expires: -1
        password_expire_max: 30
        password_expire_min: 7
        password_expire_account_disable: 1
        # password_lock: true
        shell: /bin/bash
        ssh_key_file: .ssh/id_rsa
        ssh_key_bits: 2048
        ssh_key_type: rsa
        ssh_key_passphrase: "i am batman"
        password: "{{  vault_john_hash  }}"
        update_password: "always"

    - name: testing group modules
      ansible.builtin.group:
        name: developers
        state: present
        gid: 1041
    - name: adding john to created group
      ansible.builtin.user:
        name: john
        groups:
          - developers
        append: true